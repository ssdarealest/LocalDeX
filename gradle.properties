# Gradle and JVM settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# AndroidX and AGP properties
android.useAndroidX=true
android.nonTransitiveRClass=true
# Workaround AGP 9.5 split-JavaRes transform keeping stale META-INF/INDEX.LIST in objenesis-3.4.jar for Robolectric
android.experimental.enableJavaResourceOptimizations=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
